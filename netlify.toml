[build]
  publish = "."

# Always fetch the newest app shell and offline helper so updates reach phones.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Test link only (dev branch): swap in the orange "TEST" icons and name
# so it's easy to tell apart from the live app. Production is untouched.
[context.branch-deploy]
  command = "cp icons/test/*.png icons/ && sed -i 's/\"short_name\": \"Lenten Cookbook\"/\"short_name\": \"Cookbook TEST\"/; s/\"name\": \"My Lenten Pocket Cookbook\"/\"name\": \"Lenten Cookbook (TEST)\"/' manifest.webmanifest && sed -i 's/content=\"Lenten Cookbook\"/content=\"Cookbook TEST\"/' index.html"
