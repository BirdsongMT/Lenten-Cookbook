<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Lenten Pocket Cookbook</title>
  <meta name="theme-color" content="#2B1340">
  <meta name="description" content="Fasting-friendly recipes for Great Lent.">
  <link rel="manifest" id="lnkManifest" href="manifest.webmanifest">
  <link rel="icon" id="lnkIcon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" id="lnkApple" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" id="metaAppTitle" content="Lenten Cookbook">
  <script>
    // Test link (dev--…netlify.app): orange TEST icon and name, so it's easy to tell apart.
    window.IS_TEST = /^dev--/.test(location.hostname);
    if (window.IS_TEST) {
      document.getElementById('lnkManifest').href = 'manifest-test.webmanifest';
      document.getElementById('lnkIcon').href = 'icons/test/icon-192.png';
      document.getElementById('lnkApple').href = 'icons/test/apple-touch-icon.png';
      document.getElementById('metaAppTitle').content = 'Cookbook TEST';
      document.title = 'TEST · ' + document.title;
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body class="paper">

<div class="cover" id="cover">
  <div class="cover-face">
    <img class="cover-art" src="icons/icon-512.png" alt="">
    <div class="cover-kicker">A pocket book for the Fast</div>
    <h1 class="cover-title foil">Lenten<br>Cookbook</h1>
    <p class="cover-sub">Fasting-friendly recipes for Great Lent and every fast of the year.</p>
    <div class="cover-today" id="coverToday"></div>
    <button class="cover-open" data-act="open-book">Open the book</button>
    <div class="cover-hint">or tap anywhere</div>
  </div>
</div>

<header class="hdr">
  <div class="hdr-title foil">Lenten Cookbook<small>Fasting-friendly recipes</small></div>
  <button class="today-chip" id="todayChip" aria-label="Today's fast"></button>
</header>

<main class="main">
  <section class="view" id="v-contents" aria-label="Contents"></section>
  <section class="view" id="v-today" aria-label="Today"></section>
  <section class="view" id="v-saved" aria-label="Bookmarks"></section>
  <section class="view" id="v-search" aria-label="Search"></section>
  <section class="view" id="v-list" aria-label="Shopping list"></section>
</main>

<nav class="nav" aria-label="Sections">
  <button data-view="contents" data-icon="book">Contents</button>
  <button data-view="today" data-icon="cal">Today</button>
  <button data-view="saved" data-icon="ribbon">Saved</button>
  <button data-view="search" data-icon="search">Search</button>
  <button data-view="list" data-icon="list">List<span class="badge" id="listBadge" style="display:none"></span></button>
</nav>

<div class="book" id="book" role="dialog" aria-modal="true" aria-label="Recipe">
  <article class="page" id="pageA"></article>
  <article class="page hidden" id="pageB"></article>
</div>
<div class="cook" id="cook" role="dialog" aria-modal="true" aria-label="Cook mode"></div>
<div class="timers" id="timers" aria-live="polite"></div>
<div class="toast" id="toast" role="status"></div>

<script src="recipes.js"></script>
<script src="fasting.js"></script>
<script src="app.js"></script>
</body>
</html>
